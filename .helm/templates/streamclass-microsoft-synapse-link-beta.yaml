apiVersion: streaming.sneaksanddata.com/v1
kind: StreamClass
metadata:
  name: {{ template "app.fullname" . }}-beta
  labels:
    {{- include "streamclass.labels" $ | nindent 4 }}
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  apiGroupRef: streaming.sneaksanddata.com
  kindRef: MicrosoftSynapseBetaStream
  apiVersion: v1
  pluralName: microsoft-synapse-beta-streams
  secretRefs:
    - streamConfigurationSecretRef
  overridableFields:
    # This allows use the different MergeService for running large backfills
    - .spec.sink.mergeServiceClient.connectionUrl
    - .spec.sink.mergeServiceClient.extraConnectionParameters

    # This allows override backfill behavior and the start date
    - .spec.streamMode.backfill.backfillBehavior
    - .spec.streamMode.backfill.backfillStartDate